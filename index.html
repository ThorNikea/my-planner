<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Planner</title>
<style>
:root{
  --bg:#070b18;
  --bg2:#0d1225;
  --card:rgba(16,23,45,.72);
  --card-strong:rgba(19,28,56,.88);
  --text:#eef3ff;
  --muted:#8d9abb;
  --primary:#7c6cff;
  --primary2:#36d9ff;
  --cyan:#36d9ff;
  --pink:#ff5ebc;
  --green:#43e6a1;
  --orange:#ffb45a;
  --line:rgba(136,160,220,.16);
  --shadow:0 20px 55px rgba(0,0,0,.28);
  --glow:0 0 30px rgba(124,108,255,.16);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 10% 10%,rgba(124,108,255,.12),transparent 28%),
    radial-gradient(circle at 82% 18%,rgba(54,217,255,.10),transparent 25%),
    radial-gradient(circle at 78% 88%,rgba(255,94,188,.08),transparent 30%),
    linear-gradient(135deg,var(--bg),#0a1020 48%,#080c18);
  min-height:100vh;
  overflow-x:hidden;
}
body:before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:-1;
  opacity:.3;
  background-image:
    linear-gradient(rgba(107,129,186,.055) 1px,transparent 1px),
    linear-gradient(90deg,rgba(107,129,186,.055) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:linear-gradient(to bottom,rgba(0,0,0,.9),transparent 92%);
}
body:after{
  content:"";position:fixed;inset:auto -10% -35% auto;width:46vw;height:46vw;pointer-events:none;
  background:radial-gradient(circle,rgba(124,108,255,.11),transparent 62%);
  filter:blur(24px);z-index:-1;
  animation:drift 12s ease-in-out infinite alternate;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
a{color:inherit}
.app{min-height:100vh;display:flex}
.sidebar{
  width:230px;
  background:linear-gradient(180deg,rgba(11,17,36,.92),rgba(17,24,49,.82));
  color:var(--text);
  padding:27px 16px;
  position:fixed;inset:0 auto 0 0;
  border-right:1px solid var(--line);
  backdrop-filter:blur(18px);
  box-shadow:18px 0 50px rgba(0,0,0,.18);
  z-index:5;
}
.brand{font-weight:800;font-size:21px;display:flex;align-items:center;gap:10px;margin:0 10px;letter-spacing:.02em}
.brand-icon{
  width:35px;height:35px;border-radius:11px;
  background:linear-gradient(135deg,#a79aff,#6255f5);
  display:grid;place-items:center;
  box-shadow:0 0 20px rgba(124,108,255,.36);
  animation:floaty 4s ease-in-out infinite;
}
.tag{font-size:10px;color:#8d9abb;margin:6px 0 28px 57px;text-transform:uppercase;letter-spacing:.12em}
.nav{display:grid;gap:7px}
.nav button{
  color:#9aa7c8;background:transparent;text-align:left;padding:11px 14px;border-radius:12px;
  display:flex;gap:12px;align-items:center;width:100%;transition:all .22s ease;
}
.nav button span:first-child{width:20px;text-align:center}
.nav button.active,.nav button:hover{
  background:linear-gradient(90deg,rgba(124,108,255,.15),rgba(54,217,255,.04));
  color:#fff;transform:translateX(3px);
  box-shadow:inset 0 0 0 1px rgba(124,108,255,.12),0 0 20px rgba(124,108,255,.05);
}
.sidebar-bottom{position:absolute;bottom:22px;left:16px;right:16px}
.content{margin-left:230px;width:calc(100% - 230px);padding:30px 34px 45px}
.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;animation:rise .55s ease both}
.hello h1{margin:0;font-size:30px;letter-spacing:-.03em;text-shadow:0 0 22px rgba(124,108,255,.08)}
.hello p{margin:6px 0 0;color:var(--muted)}
.version{margin-top:5px;color:#68779e;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.date-pill{
  background:rgba(255,255,255,.045);
  border:1px solid rgba(139,160,220,.16);
  padding:10px 14px;border-radius:13px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(14px);
  color:#ced8f2;
}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(300px,.8fr);gap:18px}
.card{
  background:linear-gradient(145deg,rgba(22,30,58,.78),rgba(12,17,34,.62));
  border:1px solid rgba(133,156,220,.14);
  border-radius:20px;
  box-shadow:var(--shadow),var(--glow);
  overflow:hidden;
  backdrop-filter:blur(18px);
  position:relative;
  animation:rise .65s ease both;
  transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease;
}
.card:before{
  content:"";position:absolute;left:14px;right:14px;top:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(124,108,255,.45),rgba(54,217,255,.24),transparent);
  opacity:.7;
}
.card:hover{transform:translateY(-3px);border-color:rgba(124,108,255,.22);box-shadow:var(--shadow),0 0 38px rgba(124,108,255,.1)}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}.card:nth-child(6){animation-delay:.25s}
.card-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:17px 20px;border-bottom:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.02),transparent);
}
.card-head h2{margin:0;font-size:17px;display:flex;align-items:center;gap:9px}
.badge{
  font-size:10px;padding:5px 9px;border-radius:999px;
  background:rgba(124,108,255,.11);color:#b8b0ff;border:1px solid rgba(124,108,255,.18)
}
.add{
  background:linear-gradient(135deg,#7f70ff,#5f53ef);color:#fff;padding:9px 13px;border-radius:10px;font-size:12px;
  box-shadow:0 0 18px rgba(124,108,255,.22);transition:all .2s ease
}
.add:hover{transform:translateY(-1px);box-shadow:0 0 25px rgba(124,108,255,.35)}
.ghost{
  background:rgba(124,108,255,.08);color:#bdb8ff;padding:8px 11px;border-radius:9px;font-size:12px;
  border:1px solid rgba(124,108,255,.14);transition:all .2s ease
}
.ghost:hover{background:rgba(124,108,255,.14);transform:translateY(-1px)}
.tasks{padding:2px 20px}
.task{
  display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line);
  transition:all .2s ease
}
.task:last-child{border-bottom:0}
.task:hover{padding-left:4px;padding-right:4px;background:linear-gradient(90deg,transparent,rgba(124,108,255,.04),transparent)}
.check{
  width:21px;height:21px;border:2px solid #53648e;border-radius:6px;background:rgba(255,255,255,.03);
  display:grid;place-items:center;color:#fff;flex:none;transition:all .2s ease
}
.check:hover{border-color:#8d82ff;box-shadow:0 0 16px rgba(124,108,255,.22)}
.check.done{background:linear-gradient(135deg,#8174ff,#5e54e9);border-color:#8277ff;box-shadow:0 0 18px rgba(124,108,255,.28)}
.task-name{flex:1;font-size:13px;color:#e5eaff}.task-name.done{text-decoration:line-through;color:#7784a5}
.time{font-size:11px;color:#7180a4;min-width:92px;text-align:right}
.delete-task{background:transparent;color:#7581a3;font-size:16px;padding:4px 5px;border-radius:7px;opacity:.35;transition:all .18s ease}
.task:hover .delete-task{opacity:1}.delete-task:hover{background:rgba(255,94,188,.08);color:#ff79c7}
.calendar{padding:14px 18px}.cal-top{display:flex;justify-content:space-between;align-items:center;padding:2px 0 12px}.cal-top strong{font-size:14px}
.arrows button{background:transparent;color:#92a0c3;font-size:18px;padding:2px 7px;transition:.18s ease}.arrows button:hover{color:#fff;transform:scale(1.12)}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.week div{font-size:10px;color:#6e7b9e;padding:6px 0}
.day{min-height:35px;border-radius:10px;display:grid;place-items:center;font-size:12px;cursor:pointer;color:#dbe2f5;transition:all .18s ease}
.day:hover{background:rgba(124,108,255,.10);transform:scale(1.04)}.day.muted{color:#4e5a78}
.day.selected{background:linear-gradient(135deg,#7d6eff,#5b51e9);color:#fff;box-shadow:0 0 20px rgba(124,108,255,.28)}
.day.today{box-shadow:inset 0 0 0 1px #655cff,0 0 12px rgba(124,108,255,.12)}
.events{margin-top:12px;border-top:1px solid var(--line);padding-top:11px}.event-row{display:flex;gap:8px;align-items:center;padding:6px 0;font-size:11px;color:#d8e0f4}
.dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 9px rgba(54,217,255,.7);flex:none}.small{font-size:11px;color:var(--muted)}
.rows .row{padding:12px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;transition:.2s ease}.rows .row:hover{background:rgba(124,108,255,.035)}.rows .row:last-child{border-bottom:0}
.reminder-text{flex:1;font-size:12px;color:#e2e8fa}.notify-btn{background:rgba(54,217,255,.07);color:#7be8ff;padding:8px 10px;border-radius:9px;font-size:11px;border:1px solid rgba(54,217,255,.14);transition:.2s}.notify-btn:hover{background:rgba(54,217,255,.12);transform:translateY(-1px)}.notify-btn.enabled{background:rgba(67,230,161,.08);color:#67efb6;border-color:rgba(67,230,161,.18)}
.delete-reminder{background:transparent;color:#7581a3;font-size:16px;padding:4px 5px;border-radius:7px;opacity:.35;transition:.18s}.row:hover .delete-reminder{opacity:1}.delete-reminder:hover{background:rgba(255,94,188,.08);color:#ff79c7}
.roadmap{grid-column:1/-1}.roadmap-body{padding:18px 20px;display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.road-item{
  border:1px solid rgba(133,156,220,.13);border-radius:15px;padding:15px;
  background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.018));
  transition:.22s ease;position:relative;overflow:hidden
}
.road-item:hover{transform:translateY(-3px);border-color:rgba(124,108,255,.22);box-shadow:0 10px 28px rgba(0,0,0,.14)}
.road-item:before{content:"";position:absolute;inset:auto 15px 0 15px;height:1px;background:linear-gradient(90deg,transparent,#7c6cff,transparent);opacity:.35}
.road-item h3{margin:0 0 8px;font-size:14px}.status{font-size:10px;border-radius:999px;padding:4px 7px;background:rgba(67,230,161,.08);color:#65eeb8;border:1px solid rgba(67,230,161,.16)}.road-item p{margin:8px 0 0;font-size:12px;color:#8996b8}
.quick{padding:8px 18px 15px}.link{padding:10px 12px;background:rgba(255,255,255,.025);border:1px solid rgba(133,156,220,.11);border-radius:11px;margin-top:8px;font-size:12px;display:flex;justify-content:space-between;text-decoration:none;color:#e5ebfb;transition:all .2s ease}
.link:hover{background:rgba(124,108,255,.08);transform:translateX(3px);border-color:rgba(124,108,255,.2);box-shadow:0 0 18px rgba(124,108,255,.08)}
.zoom-link{background:linear-gradient(135deg,rgba(124,108,255,.08),rgba(54,217,255,.04));font-weight:600}
.notes{padding:5px 18px 16px}.notes textarea{width:100%;min-height:100px;border:1px solid rgba(133,156,220,.13);border-radius:12px;padding:11px;resize:vertical;outline:none;background:rgba(255,255,255,.025);color:#eef3ff;transition:.2s}.notes textarea::placeholder{color:#657391}.notes textarea:focus{border-color:rgba(124,108,255,.35);box-shadow:0 0 0 3px rgba(124,108,255,.07),0 0 22px rgba(124,108,255,.08)}
.note-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:8px}.note-save{background:linear-gradient(135deg,#7e70ff,#5d51eb);color:#fff;padding:8px 11px;border-radius:9px;font-size:11px;box-shadow:0 0 16px rgba(124,108,255,.18)}.note-clear{background:rgba(255,94,188,.07);color:#ff86cd;padding:8px 11px;border-radius:9px;font-size:11px;border:1px solid rgba(255,94,188,.12)}
.note-item{margin-top:10px;padding:11px 12px;background:rgba(255,255,255,.025);border:1px solid rgba(133,156,220,.11);border-radius:12px;display:flex;gap:10px;align-items:flex-start;transition:.18s ease}.note-item:hover{border-color:rgba(124,108,255,.2);transform:translateY(-1px)}
.note-content{flex:1;font-size:12px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;color:#dce4f6}.delete-note{background:transparent;color:#7581a3;font-size:15px;padding:3px 5px;border-radius:7px;opacity:.4}.note-item:hover .delete-note{opacity:1}.delete-note:hover{background:rgba(255,94,188,.08);color:#ff79c7}
.modal-back{position:fixed;inset:0;background:rgba(3,6,16,.68);backdrop-filter:blur(10px);display:grid;place-items:center;padding:20px;z-index:10;animation:fadeIn .2s ease}.hidden{display:none!important}
.modal{width:min(450px,100%);background:linear-gradient(145deg,rgba(20,28,56,.96),rgba(11,16,33,.96));border:1px solid rgba(133,156,220,.15);border-radius:20px;padding:22px;box-shadow:0 25px 70px rgba(0,0,0,.38),0 0 35px rgba(124,108,255,.12);color:var(--text);animation:pop .22s ease}.modal h3{margin:0 0 14px}.field{margin:10px 0}.field label{display:block;font-size:11px;color:#8190b0;margin-bottom:5px}.field input,.field textarea,.field select{width:100%;border:1px solid rgba(133,156,220,.14);border-radius:10px;padding:10px;outline:none;background:rgba(255,255,255,.035);color:#eef3ff}.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(124,108,255,.4);box-shadow:0 0 0 3px rgba(124,108,255,.07)}.field select option{color:#111;background:#fff}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.cancel{background:rgba(255,255,255,.05);color:#a8b3cf;padding:10px 14px;border-radius:10px}.save{background:linear-gradient(135deg,#7e70ff,#5c51e9);color:#fff;padding:10px 14px;border-radius:10px;box-shadow:0 0 18px rgba(124,108,255,.2)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}@keyframes fadeIn{from{opacity:0}to{opacity:1}}@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(-3%,2%,0)}}
@media(max-width:1000px){.sidebar{width:190px}.content{margin-left:190px;width:calc(100% - 190px);padding:22px}.grid{grid-template-columns:1fr}.roadmap{grid-column:auto}.roadmap-body{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.sidebar{position:static;width:100%;height:auto;padding:16px}.app{display:block}.sidebar-bottom{display:none}.nav{grid-template-columns:repeat(4,1fr)}.nav button{justify-content:center}.nav button span:last-child{display:none}.content{margin:0;width:100%;padding:18px}.hello h1{font-size:24px}.top{gap:10px}.roadmap-body{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar">
<div class="brand"><div class="brand-icon">✦</div> My Planner</div>
<div class="tag">Plan · Focus · Achieve</div>
<nav class="nav">
<button class="active" onclick="scrollToId('tasksCard')"><span>⌂</span><span>Home</span></button>
<button onclick="scrollToId('tasksCard')"><span>☑</span><span>Tasks</span></button>
<button onclick="scrollToId('calendarCard')"><span>▣</span><span>Calendar</span></button>
<button onclick="scrollToId('remindersCard')"><span>♧</span><span>Reminders</span></button>
<button onclick="scrollToId('roadmapCard')"><span>◇</span><span>Roadmap</span></button>
<button onclick="scrollToId('notesCard')"><span>▤</span><span>Notes</span></button>
</nav>
<div class="sidebar-bottom">
<button class="nav" onclick="exportBackup()"><span>⇩</span><span>Backup data</span></button>
</div>
</aside>
<main class="content">
<div class="top">
<div class="hello"><h1>Good evening, Tornike 👋</h1><p>Here's what's on your plate today. Keep going!</p><div class="version">My Planner · live</div></div>
<div class="date-pill" id="headerDate"></div>
</div>
<div class="grid">
<section class="card" id="tasksCard">
<div class="card-head"><h2>☑ Today's Tasks <span class="badge" id="taskCount"></span></h2><button class="add" onclick="openModal('task')">＋ Add task</button></div>
<div class="tasks" id="taskList"></div></section>
<section class="card" id="calendarCard">
<div class="card-head"><h2>▣ Calendar</h2><button class="ghost" onclick="openModal('event')">＋ Add event</button></div>
<div class="calendar">
<div class="cal-top"><strong id="monthLabel"></strong><div class="arrows"><button onclick="changeMonth(-1)">‹</button><button onclick="changeMonth(1)">›</button></div></div>
<div class="week"><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div><div>Sun</div></div>
<div class="days" id="days"></div><div class="events"><div class="small" id="selectedLabel"></div><div id="eventList"></div></div>
</div></section>
<section class="card rows" id="remindersCard">
<div class="card-head"><h2>♧ Reminders</h2><div style="display:flex;gap:7px"><button id="notifyBtn" class="notify-btn" onclick="enableNotifications()">🔔 Enable</button><button class="ghost" onclick="openModal('reminder')">＋ Add</button></div></div>
<div id="reminderList"></div></section>
<section class="card">
<div class="card-head"><h2>🔗 Quick Links</h2></div>
<div class="quick">
<a class="link zoom-link" href="https://adjarabet.zoom.us/j/96323460735" target="_blank" rel="noopener"><span>🎥 Casino</span><span>›</span></a>
<a class="link zoom-link" href="https://adjarabet.zoom.us/j/93895483809" target="_blank" rel="noopener"><span>🎥 Sport</span><span>›</span></a>
</div>
<div class="notes" id="notesCard"><h3 style="font-size:15px;margin:6px 0 8px">📝 Notes</h3><textarea id="noteInput" placeholder="Write a new note..."></textarea><div class="note-actions"><button class="note-clear" onclick="clearNoteInput()">Clear</button><button class="note-save" onclick="saveNote()">＋ Save note</button></div><div id="notesList"></div></div>
</section>
<section class="card roadmap" id="roadmapCard">
<div class="card-head"><h2>◇ Roadmap <span class="badge">All goals</span></h2><button class="add" onclick="openModal('roadmap')">＋ Add goal</button></div>
<div class="roadmap-body" id="roadmapList"></div></section>
</div>
</main></div>
<div class="modal-back hidden" id="modalBack" onclick="if(event.target===this)closeModal()"><div class="modal"><h3 id="modalTitle"></h3><div id="modalFields"></div><div class="modal-actions"><button class="cancel" onclick="closeModal()">Cancel</button><button class="save" onclick="saveModal()">Save</button></div></div></div>
<script>
const today=new Date();let viewDate=new Date(today.getFullYear(),today.getMonth(),1),selectedDate=new Date(today.getFullYear(),today.getMonth(),today.getDate()),mode='';
const storeKey='my-planner-v1';
let data=JSON.parse(localStorage.getItem(storeKey)||'null')||{tasks:[{name:'Finish promo dashboard UI updates',time:'09:00 – 11:00',priority:'High',done:true},{name:'Daily standup',time:'11:00 – 11:15',priority:'Meeting',done:true},{name:'Review PRs',time:'13:00 – 14:00',priority:'Medium',done:false},{name:'Prepare retro notes',time:'16:30 – 17:00',priority:'Medium',done:false}],reminders:[{name:'Code review deadline',date:'Today, 15:00',priority:'High'},{name:'Monthly retro',date:'Tomorrow, 16:00',priority:'Medium'}],events:{},roadmap:[{title:'New Website',status:'In progress',desc:'Design, development and launch'},{title:'Promo Dashboard',status:'Planned',desc:'Improve visibility and reporting'},{title:'Team Improvements',status:'Planned',desc:'Small changes that make daily work easier'}],notes:[],noteCounter:0};
function persist(){localStorage.setItem(storeKey,JSON.stringify(data))}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function scrollToId(id){document.getElementById(id)?.scrollIntoView({behavior:'smooth'})}
document.getElementById('headerDate').textContent=today.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric',year:'numeric'});
if(!Array.isArray(data.notes)){
  data.notes=data.notes?[{id:1,text:String(data.notes)}]:[];
  data.noteCounter=data.notes.length?Math.max(...data.notes.map(n=>n.id)):0;
  persist();
}
renderNotes();
function renderNotes(){
  const box=document.getElementById('notesList');
  box.innerHTML='';
  data.notes.forEach((n,i)=>{
    const el=document.createElement('div');
    el.className='note-item';
    el.innerHTML='<div class="note-content">'+esc(n.text)+'</div><button class="delete-note" title="Delete note" onclick="deleteNote('+i+')">✕</button>';
    box.appendChild(el);
  });
}
function saveNote(){
  const input=document.getElementById('noteInput');
  const textValue=input.value.trim();
  if(!textValue)return;
  data.noteCounter=(data.noteCounter||0)+1;
  data.notes.push({id:data.noteCounter,text:textValue});
  input.value='';
  persist();
  renderNotes();
}
function clearNoteInput(){document.getElementById('noteInput').value=''}
function deleteNote(i){
  if(!confirm('Delete this note?'))return;
  data.notes.splice(i,1);
  persist();
  renderNotes();
}
function renderTasks(){let box=document.getElementById('taskList'),done=0;box.innerHTML='';data.tasks.forEach((t,i)=>{if(t.done)done++;let el=document.createElement('div');el.className='task';el.innerHTML='<button class="check '+(t.done?'done':'')+'" onclick="toggleTask('+i+')">'+(t.done?'✓':'')+'</button><div class="task-name '+(t.done?'done':'')+'">'+esc(t.name)+'</div><span class="badge">'+esc(t.priority||'Normal')+'</span><span class="time">'+esc(t.time||'')+'</span><button class="delete-task" title="Delete task" onclick="deleteTask('+i+')">✕</button>';box.appendChild(el)});document.getElementById('taskCount').textContent=done+' / '+data.tasks.length}
function toggleTask(i){data.tasks[i].done=!data.tasks[i].done;persist();renderTasks()}
function deleteTask(i){if(!confirm('Delete this task?'))return;data.tasks.splice(i,1);persist();renderTasks()}
function renderCalendar(){let y=viewDate.getFullYear(),m=viewDate.getMonth(),first=new Date(y,m,1),start=(first.getDay()+6)%7,last=new Date(y,m+1,0).getDate();document.getElementById('monthLabel').textContent=viewDate.toLocaleDateString(undefined,{month:'long',year:'numeric'});let days=document.getElementById('days');days.innerHTML='';for(let i=0;i<start;i++){let el=document.createElement('div');el.className='day muted';el.textContent=new Date(y,m,0).getDate()-start+i+1;days.appendChild(el)}for(let n=1;n<=last;n++){let d=new Date(y,m,n),el=document.createElement('div');el.className='day';if(iso(d)===iso(today))el.classList.add('today');if(iso(d)===iso(selectedDate))el.classList.add('selected');el.textContent=n;el.onclick=()=>{selectedDate=d;renderCalendar()};days.appendChild(el)}renderEvents()}
function renderEvents(){let k=iso(selectedDate),list=data.events[k]||[],box=document.getElementById('eventList');document.getElementById('selectedLabel').textContent=selectedDate.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});box.innerHTML='';if(!list.length){box.innerHTML='<div class="small" style="padding-top:7px">No events. Add something to this date.</div>';return}list.forEach(e=>{let el=document.createElement('div');el.className='event-row';el.innerHTML='<span class="dot"></span><b>'+esc(e.time||'')+'</b><span>'+esc(e.name)+'</span>';box.appendChild(el)})}
function changeMonth(delta){viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+delta,1);renderCalendar()}
function renderReminders(){let box=document.getElementById('reminderList');box.innerHTML='';data.reminders.forEach((r,i)=>{let el=document.createElement('div');el.className='row';el.innerHTML='<span style="font-size:16px">○</span><div class="reminder-text"><div>'+esc(r.name)+'</div><div class="small">'+esc(r.date||'')+'</div></div><span class="badge">'+esc(r.priority||'')+'</span><button class="delete-reminder" title="Delete reminder" onclick="deleteReminder('+i+')">✕</button>';box.appendChild(el)});updateNotifyButton()}
function deleteReminder(i){if(!confirm('Delete this reminder?'))return;data.reminders.splice(i,1);persist();renderReminders()}

function updateNotifyButton(){
  const b=document.getElementById('notifyBtn');
  if(!b)return;
  if('Notification' in window && Notification.permission==='granted'){b.textContent='🔔 Enabled';b.classList.add('enabled')}
  else{b.textContent='🔔 Enable';b.classList.remove('enabled')}
}
async function enableNotifications(){
  if(!('Notification' in window)){alert('This browser does not support notifications.');return}
  const p=await Notification.requestPermission();
  updateNotifyButton();
  if(p==='granted')new Notification('My Planner',{body:'Notifications are enabled ✅'});
}
function reminderTime(r){
  if(r.datetime)return new Date(r.datetime).getTime();
  return NaN;
}
function checkReminderNotifications(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  const now=Date.now();
  data.reminders.forEach(r=>{
    const t=reminderTime(r);
    if(!Number.isFinite(t))return;
    if(Math.abs(now-t)<=30000 && r.lastNotifiedAt!==t){
      new Notification('My Planner',{body:r.name});
      r.lastNotifiedAt=t;
      persist();
    }
  });
}
setInterval(checkReminderNotifications,20000);
function renderRoadmap(){let box=document.getElementById('roadmapList');box.innerHTML='';data.roadmap.forEach((r,i)=>{let el=document.createElement('div');el.className='road-item';el.innerHTML='<div style="display:flex;justify-content:space-between;gap:8px"><h3>'+esc(r.title)+'</h3><span class="status">'+esc(r.status)+'</span></div><p>'+esc(r.desc||'')+'</p><button class="ghost" style="margin-top:11px" onclick="removeRoad('+i+')">Remove</button>';box.appendChild(el)})}
function removeRoad(i){data.roadmap.splice(i,1);persist();renderRoadmap()}
function openModal(m){mode=m;document.getElementById('modalBack').classList.remove('hidden');let title=m==='task'?'Add task':m==='event'?'Add calendar event':m==='reminder'?'Add reminder':'Add roadmap goal';document.getElementById('modalTitle').textContent=title;let f='';if(m==='task')f='<div class="field"><label>Task</label><input id="f1" autofocus></div><div class="field"><label>Time</label><input id="f2" placeholder="09:00 – 10:00"></div><div class="field"><label>Priority</label><select id="f3"><option>High</option><option>Medium</option><option>Low</option><option>Meeting</option></select></div>';if(m==='event')f='<div class="field"><label>Event</label><input id="f1" autofocus></div><div class="field"><label>Time</label><input id="f2" placeholder="14:00 – 15:00"></div><div class="field"><label>Date</label><input id="f3" type="date" value="'+iso(selectedDate)+'"></div>';if(m==='reminder')f='<div class="field"><label>Reminder</label><input id="f1" autofocus></div><div class="field"><label>Date & time</label><input id="f2" type="datetime-local"></div><div class="field"><label>Priority</label><select id="f3"><option>High</option><option>Medium</option><option>Low</option></select></div>';if(m==='roadmap')f='<div class="field"><label>Goal</label><input id="f1" autofocus></div><div class="field"><label>Status</label><select id="f2"><option>Planned</option><option>In progress</option><option>Done</option></select></div><div class="field"><label>Description</label><textarea id="f3"></textarea></div>';document.getElementById('modalFields').innerHTML=f}
function closeModal(){document.getElementById('modalBack').classList.add('hidden')}
function saveModal(){let a=document.getElementById('f1')?.value.trim();if(!a)return;if(mode==='task')data.tasks.push({name:a,time:document.getElementById('f2').value,priority:document.getElementById('f3').value,done:false});if(mode==='event'){let k=document.getElementById('f3').value;if(!data.events[k])data.events[k]=[];data.events[k].push({name:a,time:document.getElementById('f2').value});selectedDate=new Date(k+'T12:00:00');viewDate=new Date(selectedDate.getFullYear(),selectedDate.getMonth(),1)}if(mode==='reminder'){const raw=document.getElementById('f2').value;const dt=new Date(raw);data.reminders.push({name:a,date:dt.toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'}),datetime:Number.isNaN(dt.getTime())?'':dt.toISOString(),priority:document.getElementById('f3').value});}if(mode==='roadmap')data.roadmap.push({title:a,status:document.getElementById('f2').value,desc:document.getElementById('f3').value});persist();closeModal();renderAll()}
function exportBackup(){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-planner-backup.json';a.click();URL.revokeObjectURL(a.href)}
function renderAll(){renderTasks();renderCalendar();renderReminders();renderRoadmap();renderNotes()}renderAll();
</script></body></html>
